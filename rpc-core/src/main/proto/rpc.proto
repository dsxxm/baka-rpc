syntax = "proto3";

package baka.rpc;

option java_package = "com.baka.protocol.protobuf";
option java_outer_classname = "RpcProtocolProto";

import "google/protobuf/any.proto";

message RpcRequest {
  string request_id = 1;
  string service_name = 2;
  string group_name = 3;
  string version = 4;
  string method_name = 5;
  repeated google.protobuf.Any parameters = 6;
  repeated string parameter_type_names = 7;
}

message RpcResponse {
  string request_id = 1;
  int64 code = 2;
  string message = 3;
  google.protobuf.Any data = 4;
  string data_type_name = 5;
}
